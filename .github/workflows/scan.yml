name: Scan regions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *" # monthly

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        region: [kizilay_merkez, ankara_central]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NikinGames/3dworldgame
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt

      - name: Fetch region
        run: PYTHONPATH=engine python scripts/scan.py regions/${{ matrix.region }}.yaml out

      - name: Pack
        run: |
          cp regions/${{ matrix.region }}.yaml DATA_LICENSES.md out/${{ matrix.region }}/
          tar -C out -czf ${{ matrix.region }}-$(date +%Y%m%d).tar.gz ${{ matrix.region }}

      # Data never touches this public repo: no artifacts, no releases here.
      # It is uploaded as a release asset of the PRIVATE data repo.
      - name: Upload to private data repo
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_REPO: NikinGames/maps-dataset-data
        run: |
          tag="scan-$(date +%Y%m%d)"
          gh release view "$tag" -R "$DATA_REPO" >/dev/null 2>&1 ||             gh release create "$tag" -R "$DATA_REPO" --title "$tag" --notes "Automated scan $tag"
          gh release upload "$tag" *.tar.gz -R "$DATA_REPO" --clobber
