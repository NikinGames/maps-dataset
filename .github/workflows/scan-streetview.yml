name: Scan Street View

# Metadata-only by default; heading JPEGs are billed, so they are opt-in.
#
# The old run reported "0 panoramas" after 2500 grid points with no error line, because
# every non-OK metadata status (including REQUEST_DENIED) was treated like ZERO_RESULTS.
# The fetcher now reports the status histogram and aborts with Google's own error
# message when the key is rejected.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region id in regions/*.yaml"
        required: true
        default: kizilay_merkez
      step_m:
        description: "Grid step metres"
        required: false
        default: "50"
      max_points:
        description: "Grid point cap (metadata calls are free but slow)"
        required: false
        default: "3000"
      fetch_images:
        description: "Also download heading images (billed, 1 = yes)"
        required: false
        default: "0"

permissions:
  contents: write

env:
  DATA_REPO: NikinGames/maps-dataset-data

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NikinGames/3dworldgame
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt

      - name: Scan Street View
        env:
          GOOGLE_SV_KEY: ${{ secrets.GOOGLE_SV_KEY }}
          SV_STEP_M: ${{ inputs.step_m }}
          SV_MAX_POINTS: ${{ inputs.max_points }}
          SV_FETCH_IMAGES: ${{ inputs.fetch_images }}
        run: |
          cd engine
          python -m pipeline.cli streetview \
            --region ../regions/${{ inputs.region }}.yaml \
            --step "$SV_STEP_M" \
            --max-points "$SV_MAX_POINTS" \
            $( [ "$SV_FETCH_IMAGES" = "1" ] && echo --images )
          mkdir -p ../out/${{ inputs.region }}-streetview
          cp -r data/raw/streetview/${{ inputs.region }}/. ../out/${{ inputs.region }}-streetview/

      - name: Pack & upload
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          set -e
          cp regions/${{ inputs.region }}.yaml DATA_LICENSES.md out/${{ inputs.region }}-streetview/
          tar -C out -czf ${{ inputs.region }}-sv-$(date +%Y%m%d).tar.gz ${{ inputs.region }}-streetview
          ls -lh *.tar.gz
          tag="sv-$(date +%Y%m%d)"
          gh release view "$tag" -R "$DATA_REPO" >/dev/null 2>&1 || \
            gh release create "$tag" -R "$DATA_REPO" --title "$tag" --notes "Street View scan $tag"
          gh release upload "$tag" *.tar.gz -R "$DATA_REPO" --clobber
