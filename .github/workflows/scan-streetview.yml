name: Scan Street View

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region id in regions/*.yaml"
        required: true
        default: kizilay_merkez
      step_m:
        description: "Grid step metres"
        required: false
        default: "50"
      fetch_images:
        description: "Also download heading images (billed)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NikinGames/3dworldgame
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt

      - name: Scan Street View
        env:
          GOOGLE_SV_KEY: ${{ secrets.GOOGLE_SV_KEY }}
          SV_STEP_M: ${{ inputs.step_m }}
          SV_FETCH_IMAGES: ${{ inputs.fetch_images }}
        run: PYTHONPATH=engine python scripts/scan_streetview.py regions/${{ inputs.region }}.yaml out

      - name: Pack
        run: |
          cp regions/${{ inputs.region }}.yaml DATA_LICENSES.md out/${{ inputs.region }}-streetview/
          tar -C out -czf ${{ inputs.region }}-sv-$(date +%Y%m%d).tar.gz ${{ inputs.region }}-streetview

      - name: Upload to private data repo
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_REPO: NikinGames/maps-dataset-data
        run: |
          tag="sv-$(date +%Y%m%d)"
          gh release view "$tag" -R "$DATA_REPO" >/dev/null 2>&1 || \
            gh release create "$tag" -R "$DATA_REPO" --title "$tag" --notes "Street View scan $tag"
          gh release upload "$tag" *.tar.gz -R "$DATA_REPO" --clobber

      - name: Push to Google Drive
        uses: ./.github/actions/drive-push
        with:
          pattern: "*.tar.gz"
          subpath: streetview
          rclone_conf: ${{ secrets.RCLONE_CONF }}
