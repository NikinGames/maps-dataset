name: Secret probe (temporary)

# Diagnostic only: reports which repo each secret can read, printing status codes
# and usernames but never the secret value. Delete once the scans run green.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: DATA_REPO_TOKEN scope
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          set +e
          for repo in NikinGames/maps-dataset-data NikinGames/3dworldgame NikinGames/maps-dataset; do
            out=$(gh api "repos/$repo" --jq '.private' 2>&1)
            if echo "$out" | grep -qE '^(true|false)$'; then
              echo "$repo: READABLE (private=$out)"
            elif echo "$out" | grep -q "403"; then
              echo "$repo: HTTP 403 (token valid, permission missing on this repo)"
            else
              echo "$repo: 404/other -> $out"
            fi
          done

      - name: MAPILLARY_TOKEN present
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
        run: echo "length=${#MAPILLARY_TOKEN}"

      - name: APIFY_TOKENS usable count
        env:
          APIFY_TOKENS: ${{ secrets.APIFY_TOKENS }}
        run: python scripts/apify_preflight.py --gha || true
