name: Scan 3D Tiles

# Google Photorealistic 3D Tiles needs a Map Tiles API session before any tileset
# request; calling root.json with only `key=` returns 404. The fetcher now creates and
# refreshes that session itself, so this workflow only passes the key through.
#
# Licensing: these tiles are for measurement and visual reference only. They must not
# ship in a game build; see DATA_LICENSES.md.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region id in regions/*.yaml"
        required: true
        default: kizilay_merkez
      target_error:
        description: "Target geometric error (smaller = finer LOD, more tiles)"
        required: false
        default: "20"
      max_tiles:
        description: "Max tiles to download"
        required: false
        default: "500"

permissions:
  contents: write

env:
  DATA_REPO: NikinGames/maps-dataset-data

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NikinGames/3dworldgame
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt

      - name: Check API key presence
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "::error::GOOGLE_MAPS_API_KEY secret is not set."
            exit 1
          fi
          echo "key present (${#GOOGLE_MAPS_API_KEY} chars)"

      - name: Fetch 3D Tiles
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          T3D_ERROR: ${{ inputs.target_error }}
          T3D_MAX_TILES: ${{ inputs.max_tiles }}
        run: PYTHONPATH=engine python scripts/scan_tiles3d.py regions/${{ inputs.region }}.yaml out

      - name: Pack & upload
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          set -e
          cp regions/${{ inputs.region }}.yaml DATA_LICENSES.md out/${{ inputs.region }}-tiles3d/
          tar -C out -czf ${{ inputs.region }}-t3d-$(date +%Y%m%d).tar.gz ${{ inputs.region }}-tiles3d
          ls -lh *.tar.gz
          tag="t3d-$(date +%Y%m%d)"
          gh release view "$tag" -R "$DATA_REPO" >/dev/null 2>&1 || \
            gh release create "$tag" -R "$DATA_REPO" --title "$tag" --notes "3D Tiles scan $tag"
          gh release upload "$tag" *.tar.gz -R "$DATA_REPO" --clobber
